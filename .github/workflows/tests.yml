name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check model artefacts match the code
        run: python scripts/check_artefacts.py

      - name: Run tests
        # seleniumbase registers a pytest plugin that rejects --timeout,
        # so rely on the job-level timeout instead.
        # Tests must not touch the network: tests/conftest.py blocks outbound
        # sockets, because an unmocked live call previously crashed this job
        # with a native "Bus error" instead of a readable failure.
        run: python -m pytest tests/ -q --no-header -p no:cacheprovider
        env:
          TF_CPP_MIN_LOG_LEVEL: '3'
